# /etc/nginx/sites-available/libreport
# Serves the built React frontend and reverse-proxies API/upload traffic to
# the Node backend running under PM2 on 127.0.0.1:4000.
#
# No domain yet: this listens on the EC2 instance's public IP over plain
# HTTP. Once you point a domain at the instance, run certbot --nginx to
# upgrade this to HTTPS (it will edit this file for you).

server {
    listen 80;
    server_name _;

    # Matches the 50mb JSON body limit the backend accepts for base64 file uploads.
    client_max_body_size 50m;

    root /var/www/libreport/frontend-build;
    index index.html;

    # React Router client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
